name: Build and Publish Dev Pre-Release

permissions:
  contents: read

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: dev-pre-release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  server-checks:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall .

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # ── Android APK ──────────────────────────────────
  build-android:
    needs: [server-checks, flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="dev-${GITHUB_SHA::7}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=0.0.0" >> "$GITHUB_ENV"

      - name: Sync dev version into source
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${PACKAGE_VERSION}\"/" android/app/build.gradle.kts
          sed -i "s/const appVersion = \".*\"/const appVersion = \"${VERSION}\"/" lib/utils/version.dart
          sed -i "s/^version: .*/version: ${PACKAGE_VERSION}/" pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Setup NDK
        run: |
          # Remove corrupted NDK install + SDK download cache
          rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
          rm -rf "$ANDROID_HOME/.temp" 2>/dev/null || true
          rm -rf "$ANDROID_HOME/.cache" 2>/dev/null || true
          # Pre-install NDK via sdkmanager (more reliable than AGP auto-download)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" 2>&1 || \
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --install "ndk;28.2.13676358" 2>&1 || true
          # Tell AGP where to find NDK so it skips auto-download
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Copy 7z binary (Android ARM64)
        run: |
          mkdir -p assets/binaries
          cp ../7zip-zstd/Android/7zz assets/binaries/7zz
          cp ../7zip-zstd/NOTICE.txt assets/binaries/NOTICE-7zip-zstd.txt
          chmod +x assets/binaries/7zz

      - name: Enable Android + generate platform files
        run: |
          flutter config --enable-android
          flutter create . --project-name sena_repo --org senarepo

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk \
             "dist/Sena-Repo_Android_${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sena-Repo_Android
          path: client/dist/Sena-Repo_Android_*.apk

  # ── Windows EXE ──────────────────────────────────
  build-windows:
    needs: [server-checks, flutter-analyze]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $V = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          echo "VERSION=$V" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PACKAGE_VERSION=0.0.0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sync dev version into source
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $pkgVer = $env:PACKAGE_VERSION
          (Get-Content pubspec.yaml) -replace '^version: .+', "version: $pkgVer" | Set-Content pubspec.yaml
          (Get-Content lib\utils\version.dart) -replace 'const appVersion = ".*"', "const appVersion = ""$ver""" | Set-Content lib\utils\version.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Copy 7z binary (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets/binaries | Out-Null
          Copy-Item "../7zip-zstd/Windows/7zz.exe" assets/binaries/7z.exe
          if (Test-Path "../7zip-zstd/Windows/7z.dll") { Copy-Item "../7zip-zstd/Windows/7z.dll" assets/binaries/7z.dll }
          if (Test-Path "../7zip-zstd/Windows/License.txt") { Copy-Item "../7zip-zstd/Windows/License.txt" assets/binaries/LICENSE-7z.txt }
          if (Test-Path "../7zip-zstd/Windows/readme.txt") { Copy-Item "../7zip-zstd/Windows/readme.txt" assets/binaries/README-7z.txt }
          Copy-Item "../7zip-zstd/NOTICE.txt" assets/binaries/NOTICE-7zip-zstd.txt

      - name: Enable Windows + generate platform files
        run: |
          flutter config --enable-windows-desktop
          Remove-Item -Recurse -Force windows/ -ErrorAction SilentlyContinue
          flutter create . --project-name sena_repo --org senarepo
          # Restore packaging config deleted by flutter create
          Copy-Item -Recurse -Force windows_assets\packaging windows\packaging

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build Windows
        run: flutter build windows --release

      - name: Setup Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install Chinese language for Inno Setup
        shell: pwsh
        run: Copy-Item "windows_assets\ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

      - name: Bundle Python + VDF
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          Copy-Item -Path "python" -Destination "$releaseDir/python" -Recurse -ErrorAction Stop
          Copy-Item -Path "../server/add_steam_game.py" -Destination "$releaseDir/add_steam_game.py" -ErrorAction Stop
          Copy-Item -Path "../server/vdf" -Destination "$releaseDir/vdf" -Recurse -ErrorAction Stop

      - name: Build installer (ISCC)
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $pkgVer = $env:PACKAGE_VERSION
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $template = Get-Content "windows_assets/packaging/exe/inno_setup.iss" -Raw
          $iss = $template `
            -replace '\{\{APP_ID\}\}', 'a1b2c3d4-e5f6-7890-abcd-ef1234567890' `
            -replace '\{\{APP_VERSION\}\}', $pkgVer `
            -replace '\{\{DISPLAY_NAME\}\}', 'Sena Repo' `
            -replace '\{\{PUBLISHER_NAME\}\}', 'Sena Repo' `
            -replace '\{\{PUBLISHER_URL\}\}', 'https://github.com/404-GCross/Sena-Repo' `
            -replace '\{\{INSTALL_DIR_NAME\}\}', '{autopf}\Sena Repo' `
            -replace '\{\{OUTPUT_BASE_FILENAME\}\}', "Sena-Repo_Windows_${ver}_Setup" `
            -replace '\{\{SETUP_ICON_FILE\}\}', (Resolve-Path "windows\runner\resources\app_icon.ico").Path `
            -replace '\{\{PRIVILEGES_REQUIRED\}\}', 'admin' `
            -replace '\{\{EXECUTABLE_NAME\}\}', 'sena_repo.exe' `
            -replace '\{\{SOURCE_DIR\}\}', $releaseDir `
            -replace '^OutputDir=\.', 'OutputDir=dist'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iss | Out-File -FilePath "dist/setup.iss" -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "dist/setup.iss"

      - name: Flatten installer artifact
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Recurse dist -Filter "*.exe" | Where-Object { $_.Name -like "*setup*" -or $_.Name -like "*Setup*" } | Select-Object -First 1
          if ($setupExe) {
            Move-Item $setupExe.FullName "dist/Sena-Repo_Windows_${env:VERSION}_Setup.exe"
            Remove-Item -Recurse -Force dist/0.* -ErrorAction SilentlyContinue
          }

      - name: Package Windows (portable zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $pkg="Sena-Repo_Windows_${env:VERSION}"
          $releaseDir = "build/windows/x64/runner/Release"
          robocopy $releaseDir $pkg /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0  # robocopy success codes 0-7 are normal, reset for Actions
          if (Test-Path "$pkg/python/python.exe") {
            Write-Host "OK: python/ included in portable package"
          } else {
            Write-Host "WARNING: python/ missing! Package contents:"
            Get-ChildItem $pkg -Directory | Select-Object Name
          }
          Compress-Archive -Path $pkg -DestinationPath "dist/$pkg.zip"

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: Sena-Repo_Windows_Portable
          path: client/dist/Sena-Repo_Windows_*.zip

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Sena-Repo_Windows_Installer
          path: client/dist/**/*.exe

  # ── Linux (AppImage) ─────────────────
  build-linux:
    needs: [server-checks, flutter-analyze]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          V="dev-${GITHUB_SHA::7}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=0.0.0" >> "$GITHUB_ENV"

      - name: Sync dev version into source
        run: |
          sed -i "s/const appVersion = \".*\"/const appVersion = \"${VERSION}\"/" lib/utils/version.dart
          sed -i "s/^version: .*/version: ${PACKAGE_VERSION}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev zstd file imagemagick \
            libayatana-appindicator3-dev libsecret-1-dev p7zip-full \
            ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      # Linux uses system 7z from p7zip-full (already installed above)

      - name: Copy 7z binary (Linux)
        run: |
          mkdir -p assets/binaries
          cp ../7zip-zstd/Linux/7zz assets/binaries/7zz
          cp ../7zip-zstd/NOTICE.txt assets/binaries/NOTICE-7zip-zstd.txt
          chmod +x assets/binaries/7zz

      - name: Enable Linux + generate platform files
        run: |
          flutter config --enable-linux-desktop
          flutter create . --project-name sena_repo --org senarepo
          # Remove template Android files that conflict with custom ones under com/github/senarepo
          rm -rf android/app/src/main/kotlin/senarepo
          python3 ../.github/scripts/patch_linux_runner_touch.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build Linux
        run: flutter build linux --release

      - name: Bundle add_steam_game.py + vdf
        run: |
          BUNDLE=build/linux/x64/release/bundle
          cp ../server/add_steam_game.py "$BUNDLE/add_steam_game.py"
          cp -r ../server/vdf "$BUNDLE/vdf"

      # ── Prepare package directory ──
      - name: Setup packaging
        run: |
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p dist

          # Desktop file + icon
          mkdir -p "$BUNDLE/usr/share/applications"
          cat > "$BUNDLE/usr/share/applications/senarepo.sena_repo.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Sena Repo
          Comment=GalGame Private Library Manager
          Exec=sena_repo
          Icon=sena-repo
          Type=Application
          Categories=Game;Utility;
          StartupWMClass=sena_repo
          DESKTOP

      # ── AppImage (universal) ──
      - name: Build AppImage
        run: |
          BUNDLE=build/linux/x64/release/bundle
          APPDIR="SenaRepo.AppDir"
          mkdir -p "$APPDIR" && cp -r "$BUNDLE"/* "$APPDIR/"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          if [ -f assets/icon.png ]; then
            convert assets/icon.png -resize 256x256 "$APPDIR/sena-repo.png"
          else
            convert -size 256x256 xc:'#7C3AED' -fill white -pointsize 120 -gravity center -annotate 0 "S" "$APPDIR/sena-repo.png"
          fi
          cp "$APPDIR/sena-repo.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/sena-repo.png"
          cp "$APPDIR/sena-repo.png" "$APPDIR/.DirIcon"
          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/sena_repo" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/senarepo.sena_repo.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Sena Repo
          Comment=GalGame Private Library Manager
          Exec=sena_repo
          Icon=sena-repo
          Type=Application
          Categories=Utility;
          StartupWMClass=sena_repo
          DESKTOP
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "dist/Sena-Repo_Linux_${VERSION}-x86_64.AppImage"
          rm -rf "$APPDIR"

      - name: Build Linux tarball
        run: |
          BUNDLE=build/linux/x64/release/bundle
          PKG="Sena-Repo_Linux_${VERSION}-x86_64"
          rm -rf "$PKG"
          mkdir -p "$PKG"
          cp -a "$BUNDLE"/. "$PKG"/
          tar -czf "dist/${PKG}.tar.gz" "$PKG"
          rm -rf "$PKG"

      - name: Build DEB and RPM packages
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          STAGE="package-root"
          APP_DIR="$STAGE/opt/sena-repo"
          DESKTOP_DIR="$STAGE/usr/share/applications"
          ICON_DIR="$STAGE/usr/share/icons/hicolor/256x256/apps"
          rm -rf "$STAGE"
          mkdir -p "$APP_DIR" "$DESKTOP_DIR" "$ICON_DIR"
          cp -a "$BUNDLE"/. "$APP_DIR"/
          if [ -f assets/icon.png ]; then
            convert assets/icon.png -resize 256x256 "$ICON_DIR/sena-repo.png"
          else
            convert -size 256x256 xc:'#7C3AED' -fill white -pointsize 120 -gravity center -annotate 0 "S" "$ICON_DIR/sena-repo.png"
          fi
          cat > "$DESKTOP_DIR/senarepo.sena_repo.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Sena Repo
          Comment=GalGame Private Library Manager
          Exec=/opt/sena-repo/sena_repo
          Icon=sena-repo
          Type=Application
          Categories=Game;Utility;
          StartupWMClass=sena_repo
          DESKTOP
          DEB_VERSION="0.0.0+${VERSION//-/.}"
          RPM_RELEASE="0.${VERSION//[^A-Za-z0-9_+.]/.}"
          fpm -s dir -t deb -n sena-repo -v "$DEB_VERSION" \
            --architecture amd64 \
            --description "Sena Repo client" \
            --url "https://github.com/404-GCross/Sena-Repo" \
            --maintainer "Sena Repo" \
            --depends libgtk-3-0 --depends libayatana-appindicator3-1 --depends libsecret-1-0 \
            -C "$STAGE" -p "dist/Sena-Repo_Linux_${VERSION}_amd64.deb" .
          fpm -s dir -t rpm -n sena-repo -v "0.0.0" --iteration "$RPM_RELEASE" \
            --architecture x86_64 \
            --description "Sena Repo client" \
            --url "https://github.com/404-GCross/Sena-Repo" \
            --maintainer "Sena Repo" \
            --depends gtk3 --depends libayatana-appindicator3 --depends libsecret \
            -C "$STAGE" -p "dist/Sena-Repo_Linux_${VERSION}_x86_64.rpm" .

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Sena-Repo_Linux
          path: client/dist/Sena-Repo_Linux_*

  # ── Docker Server Image ──────────────────────────
  build-server:
    needs: [server-checks, flutter-analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          V="dev-${GITHUB_SHA::7}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=dev" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export AMD64 tarball
        run: |
          docker buildx build --platform linux/amd64 -t sena-repo:amd64 server/ --build-arg SENA_VERSION=${VERSION} --load
          docker save sena-repo:amd64 | gzip > "Sena-Repo_Server_amd64_${VERSION}.tar.gz"

      - name: Build and export ARM64 tarball
        run: |
          docker buildx build --platform linux/arm64 -t sena-repo:arm64 server/ --build-arg SENA_VERSION=${VERSION} --load
          docker save sena-repo:arm64 | gzip > "Sena-Repo_Server_arm64_${VERSION}.tar.gz"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to registries (multi-arch)
        if: github.event_name != 'pull_request'
        run: |
          DOCKERHUB_NAMESPACE=$(printf '%s' "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ghcr.io/404-gcross/sena-repo:${DOCKER_TAG} \
            -t docker.io/${DOCKERHUB_NAMESPACE}/sena-repo:${DOCKER_TAG} \
            server/ --build-arg SENA_VERSION=${VERSION} --push

      - name: Upload Server Image (AMD64)
        uses: actions/upload-artifact@v4
        with:
          name: Sena-Repo_Server_amd64
          path: Sena-Repo_Server_amd64_*.tar.gz

      - name: Upload Server Image (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: Sena-Repo_Server_arm64
          path: Sena-Repo_Server_arm64_*.tar.gz

  # ── Publish Dev Pre-Release ─────────────────────
  publish-dev-pre-release:
    if: github.event_name != 'pull_request'
    needs: [build-android, build-windows, build-linux, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        working-directory: .
        run: |
          echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=dev-release" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        working-directory: .
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          rm -rf release
          mkdir -p release

          require_one() {
            local label="$1"
            local pattern="$2"
            local matches=()
            mapfile -d '' matches < <(find dist -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one ${label} artifact matching ${pattern}, found ${#matches[@]}."
              find dist -type f | sort
              exit 1
            fi
            if [ ! -s "${matches[0]}" ]; then
              echo "::error::Artifact ${matches[0]} is empty."
              exit 1
            fi
            cp "${matches[0]}" release/
          }

          require_one "Android APK" "Sena-Repo_Android_${VERSION}.apk"
          require_one "Windows portable zip" "Sena-Repo_Windows_${VERSION}.zip"
          require_one "Windows installer" "Sena-Repo_Windows_${VERSION}_Setup.exe"
          require_one "Linux AppImage" "Sena-Repo_Linux_${VERSION}-x86_64.AppImage"
          require_one "Linux tarball" "Sena-Repo_Linux_${VERSION}-x86_64.tar.gz"
          require_one "Linux DEB package" "Sena-Repo_Linux_${VERSION}_amd64.deb"
          require_one "Linux RPM package" "Sena-Repo_Linux_${VERSION}_x86_64.rpm"
          require_one "Server AMD64 image archive" "Sena-Repo_Server_amd64_${VERSION}.tar.gz"
          require_one "Server ARM64 image archive" "Sena-Repo_Server_arm64_${VERSION}.tar.gz"

          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate pre-release notes
        working-directory: .
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          NOTES_SOURCE=".github/dev-pre-release-notes.md"
          {
            printf '> [!CAUTION]\n'
            printf '>\n'
            printf '> **Pre-Release 自动测试版本，可能存在未知 bug，仅限测试人员使用。**\n\n'
            printf '## 版本信息\n\n'
            printf -- '- 版本号: `%s`\n' "${{ steps.meta.outputs.version }}"
            printf -- '- 发布标签: `%s`\n' "${{ steps.meta.outputs.tag }}"
            printf -- '- 提交: [`%s`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\n' "${{ steps.meta.outputs.commit }}"
            printf -- '- 构建时间: %s\n\n' "$BUILD_TIME"
            if [ -s "$NOTES_SOURCE" ]; then
              cat "$NOTES_SOURCE"
              printf '\n\n'
            else
              printf '## 自动提交摘要\n\n'
              while IFS=$'\t' read -r sha subject; do
                [ -n "$sha" ] || continue
                lower="$(printf '%s' "$subject" | tr '[:upper:]' '[:lower:]')"
                summary="$subject"
                if [[ "$summary" == *": "* ]]; then
                  summary="${summary#*: }"
                fi
                case "$lower" in
                  feat:*|feat\(*|feature:*|feature\(*)
                    category="新增"
                    ;;
                  fix:*|fix\(*|bugfix:*|bugfix\(*)
                    category="修复"
                    ;;
                  perf:*|perf\(*|refactor:*|refactor\(*|optimize:*|optimize\(*|style:*|style\(*)
                    category="优化"
                    ;;
                  docs:*|docs\(*|doc:*|doc\(*)
                    category="文档"
                    ;;
                  build:*|build\(*|ci:*|ci\(*|chore:*|chore\(*)
                    category="构建"
                    ;;
                  *)
                    category="其他"
                    ;;
                esac
                printf -- '- %s: [**%s**](https://github.com/%s/commit/%s)\n' "$category" "$summary" "${GITHUB_REPOSITORY}" "$sha"
              done < <(git log --no-merges --format='%H%x09%s' -n 5)
              printf '\n\n'
            fi
            printf '## 下载说明\n\n'
            printf '| 文件 | 平台/用途 | 说明 |\n'
            printf '|------|-----------|------|\n'
            printf '| `Sena-Repo_Android_%s.apk` | Android | Android 客户端安装包 |\n' "$VERSION"
            printf '| `Sena-Repo_Windows_%s_Setup.exe` | Windows | Windows 安装版 |\n' "$VERSION"
            printf '| `Sena-Repo_Windows_%s.zip` | Windows | Windows 便携版，解压即用 |\n' "$VERSION"
            printf '| `Sena-Repo_Linux_%s-x86_64.AppImage` | Linux | Linux AppImage 客户端 |\n' "$VERSION"
            printf '| `Sena-Repo_Linux_%s-x86_64.tar.gz` | Linux | Linux 通用压缩包，解压运行 |\n' "$VERSION"
            printf '| `Sena-Repo_Linux_%s_amd64.deb` | Linux Debian/Ubuntu | DEB 安装包 |\n' "$VERSION"
            printf '| `Sena-Repo_Linux_%s_x86_64.rpm` | Linux Fedora/RHEL/openSUSE | RPM 安装包 |\n' "$VERSION"
            printf '| `Sena-Repo_Server_amd64_%s.tar.gz` | Server AMD64 | 服务端 Docker 离线镜像 |\n' "$VERSION"
            printf '| `Sena-Repo_Server_arm64_%s.tar.gz` | Server ARM64 | 服务端 Docker 离线镜像 |\n' "$VERSION"
          } > release_notes.md

      - name: Move dev pre-release tag
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f "${{ steps.meta.outputs.tag }}"
          git push -f origin "${{ steps.meta.outputs.tag }}"

      - name: Delete existing dev pre-release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          release_id="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq '.databaseId' 2>/dev/null || true)"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "No existing release for ${TAG}; nothing to delete."
            exit 0
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          echo "Deleted existing release object for ${TAG}; tag remains and will be republished."

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 开发版 - ${{ steps.meta.outputs.version }}
          prerelease: true
          body_path: release_notes.md
          files: release/*
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
