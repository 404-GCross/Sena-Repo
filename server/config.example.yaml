# Sena Repo Server Configuration
# Copy this file to config.yaml and edit as needed.

server:
  host: "0.0.0.0"
  port: 11451
  # Browser CORS allowed origins. Native desktop/mobile clients do not need this.
  # Example: ["http://localhost:5173", "https://your-domain.example"]
  allowed_origins: []
  token_expire_days: 30

# HTTP proxy for scrapers (e.g. http://127.0.0.1:7890)
proxy: ""

# Path where game files are stored
games_path: "/path/to/your/games"

# Path where Sena Repo data (database, covers, etc.) is stored
data_path: "/path/to/data"

# Path where Steam patch files and generated patch index are stored
patch_dir: "/path/to/steam_patch"

# Optional shared keys for multi-instance deployments.
# SENA_ENCRYPTION_KEY and SENA_MANAGER_SIGNING_KEY environment variables are preferred.
# Keep these values stable when moving the database or rotating containers.
# encryption_key: ""
# manager_signing_key: ""
# OpenList proxying is disabled by default to keep file traffic off the server.
# Set SENA_ALLOW_OPENLIST_PROXY=true only for compatibility troubleshooting.

# Custom regex patterns for filename cleaning (optional)
# Each pattern must have a 'name' group and specify a platform
custom_regex:
  # - pattern: '\[(?P<platform>\w+)\](?P<name>.+)'
  #   platform: "PC"
  #   description: "Standard [PLATFORM]Name format"

# Scraper API keys (optional, fill in to enable)
# Bangumi Token: https://bgm.tv/dev/app
# VNDB Token: https://vndb.org/u/tokens
# Hikarinagi developer credentials: https://www.hikarinagi.org/developers
scrapers:
  bangumi_token: ""
  vndb_token: ""
  hikarinagi_client_id: ""
  hikarinagi_client_secret: ""
  hikarinagi_scope: "catalog:full"
  # NextMoe is an exclusive scraping mode: enabling it disables the sources above.
  nextmoe_api_key: ""
  scraper_order:
    - hikarinagi
    - vndb_kana
    - bangumi
    - steam
    - nextmoe
  enabled_scrapers:
    - hikarinagi
    - vndb_kana
    - bangumi
    - steam
  # To use NextMoe instead, replace the list above with:
  # enabled_scrapers:
  #   - nextmoe

# NextMoe·未萌 OAuth login (enabled by default).
# The default client_id is the official Sena-Repo public client
# (loopback callback http://127.0.0.1/callback, PKCE, no client_secret).
# Self-hosters can keep it or register their own public client.
# Set enabled: false to hide the NextMoe login entry entirely.
oauth:
  enabled: true
  issuer: "https://account.nextmoe.com/api/v1"
  client_id: "5b726fdccdb94ded61628f503e072ac5"
  scopes: "openid profile"
